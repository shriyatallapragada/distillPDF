[project]
name = "notebooklm-pdf"
version = "0.1.0"
description = "Local-first NotebookLM chat to study-ready PDF exporter (Python pipeline)"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "pypdf>=5.0",
    "Pillow>=10.0",
    "pypdfium2>=4.30",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nlm-pdf = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Chrome/Playwright and runs the full pipeline",
]
